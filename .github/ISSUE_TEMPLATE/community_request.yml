name: Documentation or community request
description: Request an improvement to NETVERSE public documentation or community resources.
title: "[Community] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this form for public documentation and community improvements. Do not include secrets, credentials or security vulnerabilities.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - GitHub community
        - Discord/community onboarding
        - Accessibility
        - Translation
        - Other public material
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs improvement?
      description: Describe the current public-facing problem or gap.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: Explain what would make the experience clearer or more useful.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public information check
      options:
        - label: I have not included credentials, private keys, tokens, seed phrases, proprietary code or vulnerability details.
          required: true
